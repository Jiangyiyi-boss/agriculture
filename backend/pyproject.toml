[project]
name = "huinongbao"
version = "0.1.0"
description = "慧农宝 - 智能农业管理平台后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "redis>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "alembic>=1.13.0",
    "alibabacloud-credentials>=1.0.9",
    "alibabacloud-dypnsapi20170525>=2.0.0",
    "alibabacloud-tea-openapi>=0.4.4",
    "alibabacloud-tea-util>=0.3.14",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "pymilvus>=2.4.0",
    "FlagEmbedding>=1.3.0",
    "langgraph>=1.2.0",
    "langchain-core>=1.5.0",
    "langchain-openai>=1.4.0",
    "deepagents>=0.7.6",
    "lunar_python>=1.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]
