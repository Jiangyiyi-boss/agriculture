services:
  mysql:
    image: mysql:8.0
    container_name: huinongbao-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: pg_agent
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: huinongbao-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  postgres:
    image: pgvector/pgvector:pg16
    container_name: huinongbao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agr
      POSTGRES_PASSWORD: agr_pwd
      POSTGRES_DB: agr_memory
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "agr", "-d", "agr_memory"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.4.13
    container_name: huinongbao-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: true
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build: ./backend
    container_name: huinongbao-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/pg_agent
      - REDIS_URL=redis://redis:6379/0
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - PG_URL=postgresql://agr:agr_pwd@postgres:5432/agr_memory
      - BGE_M3_DEVICE=cpu
      - BGE_M3_MODEL_PATH=/app/models/bge-m3
    volumes:
      - backend_uploads:/app/uploads
      - ./bge-m3:/app/models/bge-m3:ro
      - ./data:/app/data:ro
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      milvus:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_AMAP_WEB_KEY: ${VITE_AMAP_WEB_KEY}
        VITE_AMAP_SECURITY_CODE: ${VITE_AMAP_SECURITY_CODE}
    container_name: huinongbao-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  postgres_data:
  milvus_data:
  backend_uploads:
  bge_m3_model:
